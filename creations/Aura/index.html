<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23e8e8ed' opacity='0.8'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <span class="logo-dot"></span>
            <span class="logo-text">Aura</span>
          </div>
          <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" data-section="overview">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="1.5" y="1.5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <line x1="1.5" y1="5.5" x2="14.5" y2="5.5" stroke="currentColor" stroke-width="1.5"/>
              <line x1="5.5" y1="1.5" x2="5.5" y2="14.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Overview</span>
          </a>
          <a href="#" class="nav-item" data-section="todos">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="1.5" y="1.5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 8L7 10L11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Tasks</span>
          </a>
          <a href="#" class="nav-item" data-section="docs">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4.5V13C2 13.5523 2.44772 14 3 14H13C13.5523 14 14 13.5523 14 13V5C14 4.44772 13.5523 4 13 4H9L8 2.5H3C2.44772 2.5 2 2.94772 2 3.5V4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Docs</span>
          </a>
          <a href="#" class="nav-item" data-section="links">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6.5 9.5L9.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M7 11L5.5 12.5C4.67157 13.3284 3.32843 13.3284 2.5 12.5V12.5C1.67157 11.6716 1.67157 10.3284 2.5 9.5L4 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M9 5L10.5 3.5C11.3284 2.67157 12.6716 2.67157 13.5 3.5V3.5C14.3284 4.32843 14.3284 5.67157 13.5 6.5L12 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Links</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <span class="version">v1.0</span>
        </div>
      </aside>

      <main id="content">
        <header id="topbar">
          <div id="greeting"></div>
          <div id="live-date"></div>
        </header>

        <div id="sections">
          <!-- Overview -->
          <section id="section-overview" class="section active">
            <div class="grid">
              <div class="card" id="clock-card">
                <div class="card-header">
                  <span class="card-label">Clock</span>
                </div>
                <div class="card-body">
                  <div id="clock-display">
                    <span id="clock-time">00:00:00</span>
                    <span id="clock-seconds">00</span>
                  </div>
                  <div id="clock-date"></div>
                </div>
              </div>
              <div class="card" id="stats-card">
                <div class="card-header">
                  <span class="card-label">Stats</span>
                </div>
                <div class="card-body stats-grid">
                  <div class="stat">
                    <span class="stat-value" id="stat-todos">0</span>
                    <span class="stat-label">tasks</span>
                  </div>
                  <div class="stat">
                    <span class="stat-value" id="stat-done">0</span>
                    <span class="stat-label">done</span>
                  </div>
                  <div class="stat">
                    <span class="stat-value" id="stat-links">0</span>
                    <span class="stat-label">links</span>
                  </div>
                  <div class="stat">
                    <span class="stat-value" id="stat-files">0</span>
                    <span class="stat-label">docs</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Tasks -->
          <section id="section-todos" class="section">
            <div class="card full">
              <div class="card-header">
                <span class="card-label">Tasks</span>
                <div class="card-actions">
                  <span id="todo-count" class="count-badge">0</span>
                </div>
              </div>
              <div class="card-body">
                <div class="todo-input-row">
                  <input type="text" id="todo-input" placeholder="Add a task..." autocomplete="off" />
                  <button id="todo-add" class="primary-btn">Add</button>
                </div>
                <ul id="todo-list"></ul>
              </div>
            </div>
          </section>

          <!-- Documents -->
          <section id="section-docs" class="section">
            <div class="card full">
              <div class="card-header">
                <span class="card-label">Documents</span>
              </div>
              <div class="card-body">
                <div class="todo-input-row">
                  <input type="text" id="doc-input" placeholder="Label..." autocomplete="off" />
                  <input type="text" id="doc-path-input" placeholder="Path (optional)..." autocomplete="off" />
                  <button id="doc-add" class="primary-btn">Add</button>
                </div>
                <ul id="files-list"></ul>
              </div>
            </div>
          </section>

          <!-- Links -->
          <section id="section-links" class="section">
            <div class="card full">
              <div class="card-header">
                <span class="card-label">Quick Links</span>
                <button id="link-add-btn" class="icon-btn" aria-label="Add link">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <line x1="7" y1="1" x2="7" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
              <div class="card-body">
                <div id="links-grid"></div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Link Modal (Add / Edit) -->
    <div id="link-modal-overlay">
      <div id="link-modal">
        <h3>Add Link</h3>
        <label for="link-modal-title">Title</label>
        <input type="text" id="link-modal-title" placeholder="e.g. My Portfolio" autocomplete="off" />
        <label for="link-modal-url">URL</label>
        <input type="text" id="link-modal-url" placeholder="e.g. example.com" autocomplete="off" />
        <div class="modal-actions">
          <button class="secondary-btn" id="link-modal-cancel">Cancel</button>
          <button class="primary-btn" id="link-modal-save">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
