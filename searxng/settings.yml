# Minimal private configuration for RemiAI's internal SearXNG service.
# Keep this instance reachable only through the Docker network; do not publish
# port 8080 unless you add authentication and a TLS reverse proxy.
use_default_settings: true

server:
  bind_address: "0.0.0.0"
  # Dev-only placeholder — NOT a real secret. SearXNG requires a key other
  # than its built-in default, but in the Compose setup SEARXNG_SECRET (see
  # docker-compose.yml) overrides this at runtime, so the value here only
  # matters for runs without that env var. Generate a real one with
  # `openssl rand -hex 32` and put it in .env as SEARXNG_SECRET=… — never
  # commit a real secret here.
  secret_key: "dev-placeholder-change-via-SEARXNG_SECRET-env"

search:
  # RemiAI consumes the JSON endpoint. Keep HTML for occasional diagnostics.
  formats:
    - html
    - json
  safe_search: 1
  max_page: 3
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
