# ──────────────────────────────────────────────────────────────────────────
# Build & Release — RemiAI Desktop Installers
# ──────────────────────────────────────────────────────────────────────────
#
# Triggered when a tag matching "v*" is pushed (e.g. v1.2.0, v2.0.0).
# Builds cross-platform Electron installers and publishes them as a
# GitHub Release with attached artifacts.
#
# Prerequisites:
#   1. Add repository secrets in GitHub Settings → Secrets and variables:
#      - APPLE_ID              (macOS notarization — optional)
#      - APPLE_APP_SPECIFIC_PASSWORD  (macOS notarization — optional)
#      - APPLE_TEAM_ID         (macOS notarization — optional)
#      - CSC_LINK              (macOS code-signing cert — optional)
#      - CSC_KEY_PASSWORD      (macOS code-signing cert password — optional)
#      - GH_TOKEN              (GitHub token with repo scope)
#      - WIN_CSC_LINK          (Windows code-signing cert — optional)
#      - WIN_CSC_KEY_PASSWORD  (Windows code-signing cert password — optional)

name: Build Installer

on:
  push:
    tags:
      - "v*"       # e.g. v1.2.0, v2.0.0-beta.1
  workflow_dispatch:   # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  # ── macOS ──────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
      # Don't cancel the other arch when one fails — the two jobs are
      # independent and a failure in one should not abort the other.
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron

      - name: Build macOS installer
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — omit to skip signing)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac-${{ matrix.arch }}
          path: release/*.{dmg,zip}
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ── Windows ────────────────────────────────────────────────────────
  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron
        shell: bash

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (optional)
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64
          path: release/*.{exe,msi}
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ── Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install system dependencies required by electron-builder on Linux
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss-dev \
            libasound2-dev \
            libxtst-dev \
            libsecret-1-dev \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron

      - name: Build Linux installer
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: release/*.{AppImage,deb,rpm}
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
