# ──────────────────────────────────────────────────────────────────────────
# Build & Release — RemiAI Desktop Installers
# ──────────────────────────────────────────────────────────────────────────
#
# Triggered when a tag matching "v*" is pushed (e.g. v1.2.0, v2.0.0).
# Also supports manual workflow dispatch.
#
# Builds:
#   macOS  — x64 + arm64
#   Windows — x64
#   Linux  — AppImage + DEB + RPM
#
# All installers are written to ./release/ and attached to a draft GitHub
# Release when running from a tag. macOS installers are ad-hoc signed but
# unnotarized, so the release notes explain Gatekeeper approval.
#
# ──────────────────────────────────────────────────────────────────────────

name: Build Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ────────────────────────────────────────────────────────────────────────
  # macOS — x64 + arm64
  # ────────────────────────────────────────────────────────────────────────

  build-mac:
    name: Build macOS (${{ matrix.arch }})
    # The bundled Playwright Chromium must match the target arch, so each
    # arch builds on a native runner: macos-13 is Intel (x64), macos-latest
    # is Apple Silicon (arm64).
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Playwright's postinstall would download browsers on every install;
          # we stage them explicitly for the installer instead.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron

      - name: Stage Playwright Chromium for the installer
        run: npm run playwright:browsers

      - name: Build macOS installer
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          # The builder config explicitly selects ad-hoc signing. Never pick
          # up an unrelated certificate from a runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS installer and create checksums
        run: bash scripts/verify-macos-installer.sh "${{ matrix.arch }}" "$(node -p 'require("./package.json").version')"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Upload macOS installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.sha256
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          body: |
            ## macOS installation notice

            These macOS installers use an ad-hoc signature and are **not notarized by Apple**. macOS will require app-specific approval before opening RemiAI.

            1. Download the DMG for your Mac: `arm64` for Apple Silicon or `x64` for Intel. Download its matching `.dmg.sha256` file too.
            2. In Terminal, go to the folder containing both files and run `shasum -a 256 -c RemiAI-<version>-mac-<arch>.dmg.sha256`, substituting the release version and your architecture. It should report `OK`. If the checksum differs, delete the download and get a fresh copy from this release; do not open the mismatched file. ZIP downloads have their own `.zip.sha256` files.
            3. Open the DMG and drag RemiAI to Applications. Try opening RemiAI once. If macOS blocks it, open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway** for RemiAI, then confirm **Open**. Apple shows this option for a limited time after an opening attempt.

            If macOS still says the app is damaged after checksum verification and app-specific approval, report the macOS version, selected architecture, and exact alert in an issue. Do not disable Gatekeeper system-wide.

  # ────────────────────────────────────────────────────────────────────────
  # Windows — x64
  # ────────────────────────────────────────────────────────────────────────

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron
        shell: bash

      - name: Stage Playwright Chromium for the installer
        run: npm run playwright:browsers
        shell: bash

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows build output
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Windows build output:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -d "release" ]; then
            find release -maxdepth 2 -type f -print
          else
            echo "ERROR: release/ directory does not exist."
            exit 1
          fi

          echo ""
          echo "Installer files:"
          find release -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" \
          \) -print

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error

      - name: Upload Windows installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.msi
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ────────────────────────────────────────────────────────────────────────
  # Linux — x64
  # ────────────────────────────────────────────────────────────────────────

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss-dev \
            libasound2-dev \
            libxtst-dev \
            libsecret-1-dev \
            rpm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate app icons
        run: npm run icons

      - name: Build Next.js
        run: npm run build

      - name: Compile Electron main process
        run: npm run build:electron

      - name: Stage Playwright Chromium for the installer
        run: npm run playwright:browsers

      - name: Build Linux installer
        run: npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Linux build output
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Linux build output:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -d "release" ]; then
            find release -maxdepth 2 -type f -print
          else
            echo "ERROR: release/ directory does not exist."
            exit 1
          fi

          echo ""
          echo "Installer files:"
          find release -maxdepth 1 -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" \
          \) -print

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

      - name: Upload Linux installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
