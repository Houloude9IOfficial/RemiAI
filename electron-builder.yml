# electron-builder configuration
# Builds cross-platform installers for RemiAI Desktop App.
#
# Usage:
#   npm run dist           # Build for current platform
#   npm run dist:mac       # Build macOS DMG
#   npm run dist:win       # Build Windows NSIS installer
#   npm run dist:linux     # Build Linux AppImage

appId: com.remiai.crickdevs.com
productName: RemiAI
copyright: Copyright © 2026 RemiAI

# Replaces the standalone output's better-sqlite3 copy with the Electron-ABI
# build (the packaged app runs its server with Electron's bundled Node.js).
afterPack: scripts/after-pack.cjs

directories:
  output: release
  buildResources: build

# ── Files to include in the asar package ──────────────────────────────
# By default, electron-builder includes everything from the project
# directory.  We keep that default but exclude dev-only files.
#
# IMPORTANT: Don't add a list of inclusions here — doing so would
# override the default and leave out critical runtime deps like
# node_modules/ (required by electron-updater, better-sqlite3, etc.).
files:
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/.eslintrc*"
  - "!**/*.d.ts"
  - "!node_modules/.cache/**"

  # Next.js dev artifacts
  - "!**/.next/dev/**"
  - "!**/.next/cache/**"
  - "!**/.next/**/cache/**"

  # Staged Playwright Chromium — shipped as an extraResource instead (it
  # must sit on the real filesystem, outside asar, so the browser subprocess
  # can be spawned; including it here would double the installer size).
  - "!build/playwright-browsers/**"

  # Previous builds
  - "!release/**"
  - "!data/**"

  # ── Standalone server deps ─────────────────────────────────────────────
  # electron-builder excludes every **/node_modules/** by default (the app's
  # own deps are added back by its node-module collector). The Next.js
  # standalone output ships its OWN self-contained traced node_modules under
  # .next/standalone/node_modules, which the packaged server resolves at
  # runtime (scripts/prune-standalone.mjs keeps it lean). Re-include it as a
  # dedicated matcher — a plain "include" pattern here would otherwise turn
  # the whole files list into an explicit list and drop the default **/*
  # walk.
  - from: .next/standalone/node_modules
    to: .next/standalone/node_modules
    filter:
      - "**/*"

  # Turbopack externalizes serverExternalPackages (better-sqlite3, sharp)
  # under hashed IDs and emits symlinks in .next/standalone/.next/node_modules
  # mapping those IDs back to the real packages (e.g.
  # better-sqlite3-<hash> -> ../../node_modules/better-sqlite3). Those
  # symlinks live under a node_modules dir so they are dropped by the default
  # exclusion above — ship them too or the standalone server fails with
  # "Cannot find module 'better-sqlite3-<hash>'" under Electron's Node.
  - from: .next/standalone/.next/node_modules
    to: .next/standalone/.next/node_modules
    filter:
      - "**/*"

# ── Native modules (better-sqlite3) must be unpacked from asar ──────
# child_process.fork/spawn cannot read from inside the asar archive, so
# any binary that needs to be launched as a subprocess must be unpacked.
asar: true
asarUnpack:
  # Native .node binaries
  - "**/*.node"
  - "**/better-sqlite3/**"

  # Only unpack production Next runtime files
  - ".next/standalone/**/*"
  - ".next/server/**/*"

  # Next runtime dependencies
  - "node_modules/next/**/*"
  - "node_modules/.bin/**"

# ── Extra resources (copied outside asar) ────────────────────────────
# Files too large for the asar, or that need to be on the real FS.
extraResources:
  - from: node_modules/better-sqlite3
    to: better-sqlite3
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"

  # Playwright Chromium for the Browser Automation tool. Staged into
  # build/playwright-browsers by `npm run playwright:browsers` (run from the
  # dist scripts / CI before electron-builder). electron/main.ts sets
  # PLAYWRIGHT_BROWSERS_PATH to resources/playwright-browsers for the server.
  - from: build/playwright-browsers
    to: playwright-browsers
    filter:
      - "**/*"
      - "!**/*.md"
      - "!**/INSTALLATION.md"
      - "!**/DEPENDENCIES.md"

# ── App icon ──────────────────────────────────────────────────────────
# Icons are generated by `node scripts/generate-icons.mjs` from the
# 512×512 source logo (assets/MacLogo.icon/Assets/RemiAI-Light.png).
#
# electron-builder reads these automatically from the buildResources dir
# (build/), but we set explicit paths for clarity.  On macOS the .icns
# gives the highest quality (multi-resolution); on other platforms the
# PNG is auto-converted to the required format.

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  category: public.app-category.productivity
  hardenedRuntime: true
  # Tracked at repo root (the build/ dir is gitignored, so CI would not
  # have the entitlements file otherwise).
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # macOS code signing — set CSC_LINK / CSC_KEY_PASSWORD in CI
  # identity: null  # uncomment to skip signing for local builds

# ── Windows ──────────────────────────────────────────────────────────
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RemiAI
  uninstallDisplayName: "RemiAI ${version}"

# ── Linux ────────────────────────────────────────────────────────────
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  category: Utility
  synopsis: "RemiAI — Your local AI assistant"
  description: "A desktop app for RemiAI, your local AI assistant for your own files."

# ── Publish (for auto-update via GitHub Releases) ────────────────────
publish:
  provider: github
  owner: Houloude9IOfficial
  repo: RemiAI
  # Requires GH_TOKEN or GITHUB_TOKEN env var to be set
  releaseType: draft
