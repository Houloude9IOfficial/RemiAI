# electron-builder configuration
# Builds cross-platform installers for RemiAI Desktop App.
#
# Usage:
#   npm run dist           # Build for current platform
#   npm run dist:mac       # Build macOS DMG
#   npm run dist:win       # Build Windows NSIS installer
#   npm run dist:linux     # Build Linux AppImage

appId: com.remiai.app
productName: RemiAI
copyright: Copyright © 2026 RemiAI

directories:
  output: release
  buildResources: build

# ── Files to include in the asar package ──────────────────────────────
# By default, electron-builder includes everything from the project
# directory.  We keep that default but exclude dev-only files.
#
# IMPORTANT: Don't add a list of inclusions here — doing so would
# override the default and leave out critical runtime deps like
# node_modules/ (required by electron-updater, better-sqlite3, etc.).
files:
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/.eslintrc*"
  - "!**/*.d.ts"
  - "!node_modules/.cache/**"

  # Next.js dev artifacts
  - "!**/.next/dev/**"
  - "!**/.next/cache/**"
  - "!**/.next/**/cache/**"

  # Previous builds
  - "!release/**"
  - "!data/**"

# ── Native modules (better-sqlite3) must be unpacked from asar ──────
# child_process.fork/spawn cannot read from inside the asar archive, so
# any binary that needs to be launched as a subprocess must be unpacked.
asar: true
asarUnpack:
  # Native .node binaries
  - "**/*.node"
  - "**/better-sqlite3/**"

  # Only unpack production Next runtime files
  - ".next/standalone/**/*"
  - ".next/server/**/*"

  # Next runtime dependencies
  - "node_modules/next/**/*"
  - "node_modules/.bin/**"

# ── Extra resources (copied outside asar) ────────────────────────────
# Files too large for the asar, or that need to be on the real FS.
extraResources:
  - from: node_modules/better-sqlite3
    to: better-sqlite3
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"

# ── App icon ──────────────────────────────────────────────────────────
# Icons are generated by `node scripts/generate-icons.mjs` from the
# 512×512 source logo (assets/MacLogo.icon/Assets/RemiAI-Light.png).
#
# electron-builder reads these automatically from the buildResources dir
# (build/), but we set explicit paths for clarity.  On macOS the .icns
# gives the highest quality (multi-resolution); on other platforms the
# PNG is auto-converted to the required format.

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  category: public.app-category.productivity
  hardenedRuntime: true
  # Tracked at repo root (the build/ dir is gitignored, so CI would not
  # have the entitlements file otherwise).
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # macOS code signing — set CSC_LINK / CSC_KEY_PASSWORD in CI
  # identity: null  # uncomment to skip signing for local builds

# ── Windows ──────────────────────────────────────────────────────────
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RemiAI
  uninstallDisplayName: "RemiAI ${version}"

# ── Linux ────────────────────────────────────────────────────────────
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  category: Utility
  synopsis: "RemiAI — Your local AI assistant"
  description: "A desktop app for RemiAI, your local AI assistant for your own files."

# ── Publish (for auto-update via GitHub Releases) ────────────────────
publish:
  provider: github
  owner: Houloude9IOfficial
  repo: RemiAI
  # Requires GH_TOKEN or GITHUB_TOKEN env var to be set
  releaseType: draft
